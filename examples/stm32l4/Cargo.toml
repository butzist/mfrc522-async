[package]
name = "mfrc522-stm32l4"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
embassy-sync = { version = "0.6.0", git = "https://github.com/embassy-rs/embassy", features = ["defmt"] }
embassy-executor = { version = "0.6.1", git = "https://github.com/embassy-rs/embassy", features = ["task-arena-size-32768", "arch-cortex-m", "executor-thread", "defmt", "integrated-timers"] }
embassy-time = { version = "0.3.2", git = "https://github.com/embassy-rs/embassy", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-embedded-hal = { version = "0.2.0", git = "https://github.com/embassy-rs/embassy" }
embassy-stm32 = { version = "0.1.0", git = "https://github.com/embassy-rs/embassy", features = ["defmt", "unstable-pac", "stm32l476rg", "memory-x", "time-driver-any", "exti"]  }

cortex-m = { version = "0.7.6", features = ["critical-section-single-core"]}
cortex-m-rt= "0.7"
embedded-hal = "1.0"
embedded-hal-async = "1.0"
embedded-hal-bus = { version = "0.1", features = ["async"] }
panic-probe = { version = "0.3", features = ["print-defmt"] }
heapless = { version = "0.8", default-features = false }

defmt = "0.3"
defmt-rtt = "0.4"

mfrc522 = "0.7"

[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
opt-level = 3
overflow-checks = true

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
lto = 'fat'
opt-level = 3
overflow-checks = false

[patch.crates-io]
mfrc522 = { path = "../../" }
